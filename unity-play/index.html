<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Roll Lab · Unity 체험</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1f2430; overflow: hidden; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #1f2430; touch-action: none; }
    #load { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px; color: #fff; text-align: center; }
    #bar { width: 240px; height: 10px; border-radius: 99px; background: rgba(255,255,255,.2); overflow: hidden; }
    #bar i { display: block; height: 100%; width: 0; background: #6ea2ff; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="load"><b>Unity 게임을 불러오는 중…</b><div id="bar"><i></i></div></div>
  <script src="Build/unity-play.loader.js"></script>
  <script>
    var canvas = document.getElementById("unity-canvas");
    createUnityInstance(canvas, {
      dataUrl: "Build/unity-play.data",
      frameworkUrl: "Build/unity-play.framework.js",
      codeUrl: "Build/unity-play.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "screen-lab",
      productName: "Roll Lab",
      productVersion: "1.0"
    }, function (p) { document.querySelector("#bar i").style.width = (p * 100) + "%"; })
    .then(function () { document.getElementById("load").remove(); canvas.focus(); })
    .catch(function (m) { document.getElementById("load").innerHTML = "<b>게임을 불러오지 못했어요</b><small>" + m + "</small>"; });
    canvas.addEventListener("pointerdown", function () { canvas.focus(); });
  </script>
</body>
</html>
