<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 오늘의 운세</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #f5ecff; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(circle at 20% 10%, #4b2a86 0, transparent 45%), radial-gradient(circle at 85% 90%, #1f4d86 0, transparent 40%), #160d2b; }
  .card { width: 100%; max-width: 420px; text-align: center; }
  .tabs { display: inline-flex; background: rgba(255, 255, 255, .08); border-radius: 99px; padding: 4px; margin-bottom: 18px; }
  .tabs button { border: 0; background: none; color: #cbb8f0; font-family: inherit; font-size: 14px; font-weight: 700; padding: 8px 16px; border-radius: 99px; cursor: pointer; }
  .tabs button.on { background: #f2c94c; color: #2a1650; }
  .ball { width: 130px; height: 130px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; font-size: 56px;
    background: radial-gradient(circle at 35% 30%, #fff 0, #d9c2ff 18%, #8b5cf6 55%, #3b1d7a 100%); box-shadow: 0 0 40px #8b5cf6aa, inset 0 -10px 30px #2a1650; }
  .ball.think { animation: glow 1s ease-in-out infinite alternate; }
  @keyframes glow { to { box-shadow: 0 0 80px #f2c94ccc, inset 0 -10px 30px #2a1650; transform: scale(1.06) rotate(4deg); } }
  h1 { font-size: 22px; margin: 16px 0 4px; }
  .sub { color: #b9a6dd; font-size: 14px; }
  .row { display: flex; gap: 8px; margin-top: 18px; }
  input { flex: 1; min-width: 0; font-family: inherit; font-size: 16px; border: 2px solid #5b3fa0; background: rgba(255, 255, 255, .06); color: #fff; border-radius: 14px; padding: 12px 14px; outline: none; text-align: center; }
  input:focus { border-color: #f2c94c; }
  .go { border: 0; border-radius: 14px; padding: 0 18px; font-family: inherit; font-size: 15px; font-weight: 800; background: #f2c94c; color: #2a1650; cursor: pointer; }
  .go:disabled { opacity: .5; }
  .out { margin-top: 20px; min-height: 120px; text-align: left; }
  .line { background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .1); border-radius: 14px; padding: 11px 14px; margin-top: 8px; font-size: 15px; line-height: 1.55; opacity: 0; animation: up .5s forwards; }
  .line b { color: #f2c94c; }
  @keyframes up { from { transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .note { font-size: 12px; color: #8f7cb5; margin-top: 14px; text-align: center; }
  .err { color: #ff9aa8; text-align: center; margin-top: 16px; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="tabs"><button class="on" data-k="fortune">🔮 오늘의 운세</button><button data-k="acrostic">✍️ 이름 삼행시</button></div>
  <div class="ball" id="ball">🔮</div>
  <h1 id="title">오늘 나의 운세는?</h1>
  <p class="sub" id="sub">이름을 쓰면 AI가 오늘의 운세를 봐 줘요</p>
  <div class="row"><input id="name" maxlength="6" placeholder="이름 (예: 김하늘)"><button class="go" id="go">보기</button></div>
  <div class="out" id="out"></div>
  <p class="note">AI가 그때그때 지어내는 재미용이에요. 같은 이름도 매번 달라요!</p>
</div>
<script>
const TEXT = {
  fortune: ["🔮", "오늘 나의 운세는?", "이름을 쓰면 AI가 오늘의 운세를 봐 줘요"],
  acrostic: ["✍️", "내 이름으로 삼행시!", "이름을 쓰면 AI가 이름 글자로 삼행시를 지어 줘요"],
};
let kind = "fortune";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

document.querySelectorAll(".tabs button").forEach((b) => (b.onclick = () => {
  kind = b.dataset.k;
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
  [$("ball").textContent, $("title").textContent, $("sub").textContent] = TEXT[kind];
  $("out").innerHTML = "";
}));

async function go() {
  const name = $("name").value.replace(/\s/g, "");
  if (!name) return $("name").focus();
  $("go").disabled = true; $("ball").classList.add("think");
  $("out").innerHTML = `<p class="sub" style="text-align:center">${kind === "fortune" ? "수정 구슬이 오늘을 들여다보는 중…" : "AI가 이름을 곱씹는 중…"}</p>`;
  try {
    const r = await fetch("/api/fortune", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, kind }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    // "총운: …"처럼 앞부분은 굵게, 한 줄씩 차례로 나타나요
    $("out").innerHTML = j.lines.map((l, i) => {
      const m = l.match(/^([^:：]{1,8})[:：]\s*(.*)$/);
      return `<p class="line" style="animation-delay:${i * 0.35}s">${m ? `<b>${esc(m[1])}</b> ${esc(m[2])}` : esc(l)}</p>`;
    }).join("");
  } catch (e) {
    $("out").innerHTML = `<p class="err">${esc(e.message || "AI가 잠깐 쉬고 있어요")}</p>`;
  } finally {
    $("go").disabled = false; $("ball").classList.remove("think");
  }
}
$("go").onclick = go;
$("name").onkeydown = (e) => e.key === "Enter" && go();
</script>
</body>
</html>
